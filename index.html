<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar" data-variant="postal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F3E8">
<title>خالد و هايدي</title>
<meta name="description" content="دعوة حفل زفاف خالد و هايدي">

<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/v-postal.css">
<link rel="stylesheet" href="css/v-manuscript.css">
<link rel="stylesheet" href="css/v-arabesque.css">
<link rel="stylesheet" href="css/v-garden.css">
<link rel="stylesheet" href="css/v-night.css">
<link rel="stylesheet" href="css/v-modern.css">
</head>
<body>

<span id="progress" aria-hidden="true"></span>

<!-- ══ OPENINGS — one per variant, only the active one is displayed ══ -->

<!-- manuscript: a paper envelope closed with a real wax seal -->
<div class="gate" id="gate-envelope">
  <div class="env-wrap">
    <p class="env-bism" data-t="bism"></p>
    <button class="envelope" data-open aria-label="افتح الدعوة">
      <span class="env-back paper"></span>
      <span class="env-card paper">
        <img src="assets/couple-hero.jpg" alt="" width="960" height="1200">
        <span class="cap" data-t="gateCap"></span>
      </span>
      <span class="env-flap paper"></span>
      <span class="seal">
        <span class="seal-face"></span>
        <span class="seal-mono" data-t="monogram"></span>
      </span>
    </button>
    <p class="gate-hint" data-t="hintSeal"></p>
  </div>
</div>

<!-- arabesque: two mashrabiya screens part -->
<div class="gate" id="gate-screens">
  <div class="screens" data-screens>
    <span class="screen left"></span>
    <span class="screen right"></span>
    <div class="screens-copy">
      <span class="mono"><span data-t="monogram"></span></span>
      <p class="gate-hint hint" data-t="hintTap"></p>
    </div>
  </div>
  <button class="gate-open-btn" data-open aria-label="افتح الدعوة"></button>
</div>

<!-- postal: the couple's dove envelope, photographed closed and open -->
<div class="gate" id="gate-dove">
  <button class="dove-gate" data-open aria-label="افتح الدعوة">
    <span class="dove-stack">
      <img class="dove-closed" src="assets/env-dove.png" alt="" width="360" height="360">
      <img class="dove-open"   src="assets/env-dove-open.png" alt="" width="626" height="418">
      <span class="dove-card"><img src="assets/couple-hero.jpg" alt="" width="960" height="1200"></span>
    </span>
    <span class="gate-hint" data-t="hintTap"></span>
  </button>
</div>

<!-- garden: the blue envelope, sealed with the couple's wax stamp -->
<div class="gate" id="gate-bloom">
  <button class="bloom-gate" data-open aria-label="افتح الدعوة">
    <span class="bloom-stack">
      <span class="bloom-card"><img src="assets/couple-story.jpg" alt="" width="880" height="1100"></span>
      <img class="env" src="assets/env-open.png" alt="" width="490" height="572">
      <img class="bloom-seal" src="assets/seal.png" alt="" width="420" height="420">
    </span>
    <span class="gate-hint" data-t="hintSeal"></span>
  </button>
</div>

<!-- night: a hanging gold star; tap it and fireworks light the sky -->
<div class="gate" id="gate-star">
  <canvas class="fw" id="fw" aria-hidden="true"></canvas>
  <button class="star-gate" data-open aria-label="افتح الدعوة">
    <span class="star" aria-hidden="true"></span>
    <span class="gate-hint" data-t="hintStar"></span>
  </button>
</div>

<!-- modern: a curtain wipes up -->
<div class="gate" id="gate-curtain">
  <button class="curtain" data-open aria-label="افتح الدعوة">
    <span class="sub" data-t="kicker"></span>
    <span class="nm">
      <span data-name="groom"></span>
      <span class="amp" data-t="amp"></span>
      <span data-name="bride"></span>
    </span>
    <span class="gate-hint hint" data-t="hintTap"></span>
  </button>
</div>

<!-- ══ CHROME ══════════════════════════════════════════════════════ -->

<div class="switcher" role="group" aria-label="خيارات العرض">
  <button class="lang-btn" id="langBtn" type="button"></button>
  <span aria-hidden="true" style="width:1px;height:17px;background:var(--line)"></span>
  <span class="variants" id="variants"></span>
</div>

<!-- ══ PAGE ════════════════════════════════════════════════════════ -->

<main id="page">

  <header class="hero" id="hero">
    <canvas id="dust" aria-hidden="true"></canvas>

    <span class="deco deco-dove" aria-hidden="true"><img src="assets/env-dove.png" alt="" width="360" height="360"></span>
    <span class="deco deco-blossom" aria-hidden="true"><img src="assets/flower-blossom.png" alt="" width="98" height="310"></span>

    <div class="hero-media">
      <div class="frame wipe" id="heroFrame">
        <img src="assets/couple-hero.jpg" alt="" width="960" height="1200">
      </div>
    </div>

    <div class="hero-copy">
      <p class="bism reveal" data-t="bism"></p>
      <p class="kicker reveal" data-t="kicker"></p>
      <h1 class="names reveal" id="names">
        <span data-name="groom"></span>
        <span class="amp" data-t="amp"></span>
        <span data-name="bride"></span>
      </h1>
      <div class="orn reveal"><i></i></div>
      <p class="hero-date reveal" id="heroDate"></p>
      <p class="hero-where reveal" id="heroWhere"></p>
      <div class="count reveal" id="count">
        <div><b id="cd">٠</b><span data-t="days"></span></div>
        <div><b id="ch">٠</b><span data-t="hours"></span></div>
        <div><b id="cm">٠</b><span data-t="mins"></span></div>
        <div><b id="cs">٠</b><span data-t="secs"></span></div>
      </div>
    </div>
  </header>

  <section class="ayah-sec">
    <div class="wrap">
      <p class="ayah reveal" data-t="ayah"></p>
      <p class="ayah-src reveal" data-t="ayahSrc"></p>
    </div>
  </section>

  <span class="rule" aria-hidden="true"></span>

  <section id="welcome" data-n>
    <span class="deco deco-flower" aria-hidden="true"><img src="assets/flower-rose.png" alt="" width="235" height="335"></span>
    <div class="wrap-wide story" data-num="01">
      <div class="frame wipe">
        <img src="assets/couple-story.jpg" alt="" width="880" height="1100" loading="lazy">
      </div>
      <div class="txt reveal">
        <p class="eyebrow" data-t="welcomeEyebrow"></p>
        <h2 data-split data-t="welcomeTitle"></h2>
        <div class="orn"><i></i></div>
        <p class="lede" data-t="welcomeBody"></p>
      </div>
    </div>
  </section>

  <section id="details" data-n>
    <div class="wrap-wide" data-num="02">
      <p class="eyebrow reveal" data-t="detailsEyebrow"></p>
      <h2 class="reveal" data-split data-t="detailsTitle"></h2>
      <div class="cards">
        <div class="card reveal">
          <span class="k" data-t="kWhen"></span>
          <span class="v" id="cardDate"></span>
          <span class="n" id="cardDay"></span>
        </div>
        <div class="card reveal">
          <span class="k" data-t="kTime"></span>
          <span class="v" id="cardTime"></span>
          <span class="n" data-t="timeNote"></span>
        </div>
        <div class="card reveal">
          <span class="k" data-t="kDress"></span>
          <span class="v" data-t="dressValue"></span>
          <span class="n" data-t="dressNote"></span>
        </div>
      </div>
      <div class="btn-row reveal">
        <button class="btn" id="calBtn" type="button" data-t="addToCalendar"></button>
      </div>
    </div>
  </section>

  <div class="venue-stage" id="venueStage">
    <div class="venue-pin">
      <img id="venueImg" src="assets/venue-main.jpg" alt="" width="1320" height="901" loading="lazy">
      <span class="venue-veil" aria-hidden="true"></span>
      <div class="venue-copy">
        <p class="eyebrow" data-t="venueEyebrow"></p>
        <h2 id="venueName"></h2>
        <div class="orn"><i></i></div>
        <p class="lede" id="venueAddress"></p>
        <div class="btn-row">
          <a class="btn" id="mapBtn" href="#" target="_blank" rel="noopener" data-t="openMap"></a>
        </div>
      </div>
    </div>
  </div>

  <section id="rsvp" data-n>
    <span class="deco deco-bloomenv" aria-hidden="true"><img src="assets/env-open.png" alt="" width="490" height="572"></span>
    <div class="wrap" data-num="03">
      <p class="eyebrow reveal" data-t="rsvpEyebrow"></p>
      <h2 class="reveal" data-split data-t="rsvpTitle"></h2>
      <p class="lede reveal" data-t="rsvpBody"></p>

      <form class="form reveal" id="rsvpForm" novalidate>
        <div class="field">
          <label for="rName" data-t="fName"></label>
          <input type="text" id="rName" name="name" autocomplete="name">
        </div>
        <div class="field">
          <label data-t="fAttending"></label>
          <div class="choice">
            <label><input type="radio" name="attending" value="yes" checked><span data-t="optYes"></span></label>
            <label><input type="radio" name="attending" value="no"><span data-t="optNo"></span></label>
          </div>
        </div>
        <div class="field" id="guestsField">
          <label for="rGuests" data-t="fGuests"></label>
          <select id="rGuests" name="guests">
            <option>0</option><option>1</option><option>2</option>
            <option>3</option><option>4</option><option>5+</option>
          </select>
        </div>
        <div class="field" id="namesField">
          <label for="rNames" data-t="fGuestNames"></label>
          <textarea id="rNames" name="guestNames" rows="2"></textarea>
        </div>
        <div class="field">
          <label for="rPhone" data-t="fPhone"></label>
          <input type="tel" id="rPhone" name="phone" autocomplete="tel" inputmode="tel">
        </div>
        <button class="btn" type="submit" id="rsvpSubmit" data-t="sendRsvp"></button>
        <p class="status" id="rsvpStatus" role="status"></p>
      </form>
    </div>
  </section>

  <span class="rule" aria-hidden="true"></span>

  <section id="guestbook" data-n>
    <div class="wrap" data-num="04">
      <p class="eyebrow reveal" data-t="wishEyebrow"></p>
      <h2 class="reveal" data-split data-t="wishTitle"></h2>
      <p class="lede reveal" data-t="wishBody"></p>

      <form class="form reveal" id="wishForm" novalidate>
        <div class="field">
          <label for="wName" data-t="fName"></label>
          <input type="text" id="wName" name="name" autocomplete="name">
        </div>
        <div class="field">
          <label for="wMsg" data-t="fMessage"></label>
          <textarea id="wMsg" name="message" rows="3"></textarea>
        </div>
        <button class="btn" type="submit" id="wishSubmit" data-t="sendWish"></button>
        <p class="status" id="wishStatus" role="status"></p>
      </form>

      <div class="wishes" id="wishList"></div>
      <p class="wishes-empty hidden" id="wishEmpty" data-t="noWishes"></p>
    </div>
    <span class="deco deco-rose" aria-hidden="true"><img src="assets/env-rose.png" alt="" width="483" height="360"></span>
  </section>

  <footer>
    <span class="deco deco-dovegold" aria-hidden="true"><img src="assets/dove-gold.png" alt="" width="318" height="148"></span>
    <div class="orn"><i></i></div>
    <p class="hashtag" id="hashtag"></p>
    <small data-t="footerNote"></small>
  </footer>

</main>

<script>
/* ═════════════════════════════════════════════════════════════════

   ═════════════════════════════════════════════════════════════════ */
const CONFIG = {

/* ═════════════════════════════════════════════════════════════════
   WORDING — Egyptian Arabic, and English.
   ═════════════════════════════════════════════════════════════════ */
const T = {
  ar: {
    bism: "بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيمِ",
    monogram: CONFIG.monogram.ar,
    gateCap: "حفل زفاف",
    hintSeal: "دوس على الختم تفتح الدعوة",

    ayah: "وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً",
    ayahSrc: "سورة الروم — الآية ٢١",

    welcomeEyebrow: "أهلاً بيكم",

                 "وجودكم معانا هو أغلى هدية، وفرحتنا مش هتكمل من غيركم.",

    kicker: "The wedding of",

    ayah: "And among His signs is that He created for you mates from among yourselves, " +
          "that you may find tranquillity in them, and He placed between you affection and mercy.",
    ayahSrc: "Ar-Rum — 21",

    welcomeEyebrow: "Welcome",

    sendFailed: "That didn't send. Please try once more.",

    wishEyebrow: "Guestbook",
    wishTitle: "Leave us a word",
    wishBody: "Write a wish or a memory. We'll keep it for good.",
    fMessage: "Your message",
    sendWish: "Send your wish",
    wishOk: "Thank you, truly, for your words.",
    wishNeed: "Please add your name and a message.",
    noWishes: "Be the first to leave a word.",

    footerNote: "We'll be waiting for you",
    waIntro: "RSVP"

};

/* ═════════════════════════════════════════════════════════════════
   Runtime
   ═════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";

  const root   = document.documentElement;
  const $      = (s, c) => (c || document).querySelector(s);
  const $$     = (s, c) => Array.from((c || document).querySelectorAll(s));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const START = new Date(CONFIG.startsAt);
  const END   = new Date(CONFIG.endsAt);

  const VARIANTS = ["postal", "manuscript", "arabesque", "garden", "night", "modern"];
  const GATE_OF = {
    postal:     "gate-dove",
    manuscript: "gate-envelope",
    arabesque:  "gate-screens",
    garden:     "gate-bloom",
    night:      "gate-star",
    modern:     "gate-curtain"
  };

  let lang    = CONFIG.defaultLang === "en" ? "en" : "ar";
  let variant = VARIANTS.includes(CONFIG.defaultVariant) ? CONFIG.defaultVariant : "manuscript";
  let opened  = false;

  const locale = () => (lang === "ar" ? "ar-EG" : "en-GB");
  const num    = n => Number(n).toLocaleString(locale());

  const KEY = { rsvp: "hk.rsvp.v1", wish: "hk.wishes.v1" };
  const store = {
    read(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } },
    push(k, v) {
      const list = store.read(k); list.push(v);
      try { localStorage.setItem(k, JSON.stringify(list)); } catch (e) {}
      return list;
    }
  };

  /* ── words split for the staggered heading reveal ───────────────── */
  function setSplit(el, text) {
    el.textContent = "";
    text.split(" ").forEach((word, i) => {
      const s = document.createElement("span");
      s.className = "w";
      s.textContent = word;
      s.style.transitionDelay = i * 55 + "ms";
      el.append(s, document.createTextNode(" "));
    });
    if (el.classList.contains("in")) {
      requestAnimationFrame(() => $$(".w", el).forEach(w => w.classList.add("in")));
    }
  }

  /* ── language ──────────────────────────────────────────────────── */
  function applyLang(next) {
    lang = next;
    root.lang = lang;
    root.dir  = lang === "ar" ? "rtl" : "ltr";
    root.dataset.lang = lang;

    const t = T[lang];
    $$("[data-t]").forEach(el => {
      const v = t[el.dataset.t];
      if (v === undefined) return;
      if (el.hasAttribute("data-split")) setSplit(el, v);
      else el.textContent = v;
    });
    $$("[data-name]").forEach(el => { el.textContent = CONFIG[el.dataset.name][lang]; });

    $("#venueName").textContent    = CONFIG.venue.name[lang];
    $("#venueAddress").textContent = CONFIG.venue.address[lang];
    $("#hashtag").textContent      = CONFIG.hashtag;
    $("#heroWhere").textContent    = CONFIG.venue.name[lang] + " · " + CONFIG.venue.address[lang];

    $("#langBtn").textContent = lang === "ar" ? "EN" : "ع";
    $("#langBtn").setAttribute("aria-label",
      lang === "ar" ? "Switch to English" : "التبديل إلى العربية");
    $$("[data-open]").forEach(b =>
      b.setAttribute("aria-label", lang === "ar" ? "افتح الدعوة" : "Open the invitation"));

    const L = locale();
    const dateOpts = { day: "numeric", month: "long", year: "numeric" };
    $("#heroDate").textContent = START.toLocaleDateString(L, dateOpts);
    $("#cardDate").textContent = START.toLocaleDateString(L, dateOpts);
    $("#cardDay").textContent  = START.toLocaleDateString(L, { weekday: "long" });
    const tm = d => d.toLocaleTimeString(L, { hour: "numeric", minute: "2-digit" });
    $("#cardTime").textContent = tm(START) + " – " + tm(END);

    $$("section[data-n] > [data-num]").forEach(el => {
      el.setAttribute("data-num", num(el.dataset.num).padStart ? el.dataset.num : el.dataset.num);
    });

    renderWishes();
    tick();
  }

  /* ── variant ───────────────────────────────────────────────────── */

  // put every gate back to its sealed state
  function resetGates() {
    $$(".gate").forEach(g => g.classList.remove("done"));
    $$(".envelope, .dove-gate, .bloom-gate, .curtain, .star-gate")
      .forEach(b => b.classList.remove("pressing", "opening", "gone"));
    const scr = $("[data-screens]");
    if (scr) scr.classList.remove("parting");
    const fw = $("#fw");
    if (fw) fw.getContext("2d").clearRect(0, 0, fw.width, fw.height);
  }

  function applyVariant(next) {
    // switching variants always starts over from that variant's opening
    if (opened && next !== variant) {
      opened = false;
      document.body.classList.remove("open");
      document.body.classList.add("locked");
      $$(".reveal, .wipe, .w").forEach(el => el.classList.remove("in"));
      const hero = $("#hero");
      if (hero) hero.style.opacity = "1";
      scrollTo({ top: 0, behavior: "instant" });
    }

    variant = next;
    root.dataset.variant = variant;
    $$(".v-dot").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === variant)));

    // only the active variant's gate is allowed on screen
    if (!opened) {
      resetGates();
      Object.entries(GATE_OF).forEach(([v, id]) => {
        const g = document.getElementById(id);
        if (g) g.style.visibility = (v === variant) ? "" : "hidden";
      });
    }

    const bg = getComputedStyle(root).getPropertyValue("--ground").trim();
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta && bg) meta.setAttribute("content", bg);
  }

  VARIANTS.forEach(name => {
    const b = document.createElement("button");
    b.className = "v-dot"; b.type = "button"; b.dataset.v = name;
    b.setAttribute("aria-label", name);
    b.addEventListener("click", () => applyVariant(name));
    $("#variants").appendChild(b);
  });
  $("#langBtn").addEventListener("click", () => applyLang(lang === "ar" ? "en" : "ar"));

  /* ── countdown ─────────────────────────────────────────────────── */
  function tick() {
    const ms = START - new Date();
    const box = $("#count");
    if (ms <= 0) { box.style.visibility = "hidden"; return; }
    box.style.visibility = "visible";
    const s = Math.floor(ms / 1000);
    $("#cd").textContent = num(Math.floor(s / 86400));
    $("#ch").textContent = num(Math.floor(s / 3600) % 24);
    $("#cm").textContent = num(Math.floor(s / 60) % 60);
    $("#cs").textContent = num(s % 60);
  }
  setInterval(tick, 1000);

  $("#mapBtn").href = CONFIG.mapUrl;

  /* ── reveals ───────────────────────────────────────────────────── */
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add("in");
      $$(".w", e.target).forEach(w => w.classList.add("in"));
      io.unobserve(e.target);
    });
  }, { threshold: .12, rootMargin: "0px 0px -6% 0px" });

  function observeAll() {
    $$(".reveal, .wipe").forEach((el, i) => {
      if (!el.dataset.delayed) {
        el.style.transitionDelay = Math.min(i % 5, 4) * 80 + "ms";
        el.dataset.delayed = "1";
      }
      io.observe(el);
    });
  }

  /* ── scroll effects ────────────────────────────────────────────── */
  let fxOn = false;
  function scrollFx() {
    if (fxOn || reduce) return;
    fxOn = true;
    const bar   = $("#progress");
    const hero  = $("#hero");
    const frame = $("#heroFrame");
    const names = $("#names");
    let ticking = false;

    function frameFn() {
      const y = scrollY;
      const max = document.documentElement.scrollHeight - innerHeight;
      bar.style.transform = "scaleX(" + (max > 0 ? y / max : 0) + ")";

      const hh = hero.offsetHeight;
      if (y < hh) {
        const p = y / hh;
        frame.style.transform = "translateY(" + (y * .18) + "px)";
        names.style.transform = "translateY(" + (y * .08) + "px)";
        hero.style.opacity    = String(Math.max(0, 1 - p * 1.2));
      }
      ticking = false;
    }

    addEventListener("scroll", () => {
      if (!ticking) { ticking = true; requestAnimationFrame(frameFn); }
    }, { passive: true });
    frameFn();
  }

  /* ── ambient dust ──────────────────────────────────────────────── */
  let dustOn = false;
  function dust() {
    if (dustOn || reduce) return;
    dustOn = true;
    const cv = $("#dust"), ctx = cv.getContext("2d"), host = cv.parentElement;
    let w, h, motes = [], raf = 0;

    function size() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      w = host.clientWidth; h = host.clientHeight;
      cv.width = w * dpr; cv.height = h * dpr;
      cv.style.width = w + "px"; cv.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      motes = Array.from({ length: Math.round(Math.min(w, 760) / 13) }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        r: Math.random() * 1.5 + .35, v: Math.random() * .22 + .05,
        d: Math.random() * Math.PI * 2, a: Math.random() * .45 + .12
      }));
    }
    function paint() {
      // postal and garden get falling petals; night gets twinkling stars;
      // the rest, rising gold dust
      const petals = variant === "postal" || variant === "garden";
      const stars  = variant === "night";
      const styles = getComputedStyle(root);
      const palette = petals
        ? [styles.getPropertyValue("--accent").trim(), styles.getPropertyValue("--accent-2").trim(), "#BE9A4E"]
        : stars
        ? ["#D4AF6A", "#EDEAF2", "#E7CD96"]
        : [styles.getPropertyValue("--accent").trim() || "#B4893C"];

      ctx.clearRect(0, 0, w, h);
      motes.forEach((m, i) => {
        ctx.fillStyle = palette[i % palette.length];
        if (stars) {
          // fixed in place, breathing
          m.d += .022;
          ctx.globalAlpha = m.a * (.4 + .6 * Math.abs(Math.sin(m.d + i)));
          ctx.beginPath(); ctx.arc(m.x, m.y, m.r * .85, 0, Math.PI * 2); ctx.fill();
          return;
        }
        m.d += .008; m.x += Math.sin(m.d) * .28;
        if (petals) {
          m.y += m.v * 1.4;
          if (m.y > h + 8) { m.y = -8; m.x = Math.random() * w; }
        } else {
          m.y -= m.v;
          if (m.y < -6) { m.y = h + 6; m.x = Math.random() * w; }
        }
        ctx.globalAlpha = m.a;
        if (petals) {
          ctx.save();
          ctx.translate(m.x, m.y);
          ctx.rotate(m.d * 2);
          ctx.beginPath();
          ctx.ellipse(0, 0, m.r * 2.6, m.r * 1.3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(paint);
    }
    size();
    addEventListener("resize", size, { passive: true });
    paint();
    new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { if (!raf) paint(); }
      else { cancelAnimationFrame(raf); raf = 0; }
    }, { threshold: 0 }).observe(host);
  }

  /* ── the openings ──────────────────────────────────────────────── */

  // fireworks for the night gate, drawn on its own canvas
  function fireworks() {
    const cv = $("#fw");
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const colors = ["#D4AF6A", "#F3E3B8", "#EDEAF2", "#C98A83"];
    const parts = [];
    function burst(x, y, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 3.4 + .7;
        parts.push({
          x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: 1, c: colors[i % colors.length], r: Math.random() * 1.9 + .8
        });
      }
    }
    burst(w * .5,  h * .32, 100);
    setTimeout(() => burst(w * .3,  h * .46, 65), 280);
    setTimeout(() => burst(w * .72, h * .4,  65), 520);

    let frames = 0;
    (function fr() {
      ctx.clearRect(0, 0, w, h);
      let alive = false;
      parts.forEach(p => {
        if (p.life <= 0) return;
        alive = true;
        p.x += p.vx; p.y += p.vy;
        p.vy += .03; p.vx *= .985; p.vy *= .985;
        p.life -= .012;
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      if (alive && ++frames < 220) requestAnimationFrame(fr);
      else ctx.clearRect(0, 0, w, h);
    })();
  }

  function openGate(btn) {
    if (opened) return;
    opened = true;

    const gate = btn.closest(".gate");

    if (variant === "manuscript") {
      btn.classList.add("pressing");
      setTimeout(() => { btn.classList.remove("pressing"); btn.classList.add("opening"); }, 170);
      setTimeout(() => btn.classList.add("gone"), reduce ? 0 : 1900);
    } else if (variant === "arabesque") {
      $("[data-screens]").classList.add("parting");
    } else if (variant === "modern") {
      btn.classList.add("opening");
    } else if (variant === "night") {
      btn.classList.add("opening");            // the star launches…
      if (!reduce) fireworks();                // …and bursts
    } else { // postal and garden: the photographed envelopes
      btn.classList.add("pressing");
      setTimeout(() => { btn.classList.remove("pressing"); btn.classList.add("opening"); }, 150);
      setTimeout(() => btn.classList.add("gone"), reduce ? 0 : 1950);
    }

    const wait = reduce ? 0
      : variant === "modern"    ? 1150
      : variant === "arabesque" ? 1350
      : variant === "night"     ? 2150
      : 2050;

    setTimeout(() => {
      gate.classList.add("done");   // gates stay in the DOM, sealed again on variant switch
      document.body.classList.remove("locked");
      document.body.classList.add("open");
      observeAll();
      scrollFx();
      dust();
    }, wait);
  }
  $$("[data-open]").forEach(b => b.addEventListener("click", () => openGate(b)));

  /* ── sending ───────────────────────────────────────────────────── */
  async function post(payload) {
    if (!CONFIG.endpoint) return "local";
    await fetch(CONFIG.endpoint, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    return "sent";
  }

  /* ── RSVP ──────────────────────────────────────────────────────── */
  const rsvpForm = $("#rsvpForm");
  function syncAttending() {
    const yes = rsvpForm.attending.value === "yes";
    $("#guestsField").classList.toggle("hidden", !yes);
    $("#namesField").classList.toggle("hidden", !yes);
  }
  $$("input[name='attending']", rsvpForm).forEach(r => r.addEventListener("change", syncAttending));
  syncAttending();

  rsvpForm.addEventListener("submit", async e => {
    e.preventDefault();
    const t = T[lang], status = $("#rsvpStatus");
    const name = $("#rName").value.trim();
    if (!name) { status.textContent = t.rsvpNeedName; $("#rName").focus(); return; }

    const attending = rsvpForm.attending.value;
    const entry = {
      type: "rsvp", name, attending,
      guests: attending === "yes" ? $("#rGuests").value : "0",
      guestNames: attending === "yes" ? $("#rNames").value.trim() : "",
      phone: $("#rPhone").value.trim(),
      lang, at: new Date().toISOString()
    };

    const btn = $("#rsvpSubmit");
    btn.disabled = true; status.textContent = t.sending;
    try {
      const mode = await post(entry);
      store.push(KEY.rsvp, entry);
      status.textContent = attending === "yes" ? t.rsvpOkYes : t.rsvpOkNo;
      rsvpForm.reset(); syncAttending();
      if (mode === "local" && CONFIG.whatsapp) {
        const msg = t.waIntro + ": " + entry.name + " — " +
          (attending === "yes" ? t.optYes : t.optNo) +
          (entry.guests !== "0" ? " (+" + entry.guests + ")" : "") +
          (entry.phone ? " — " + entry.phone : "");
        open("https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(msg), "_blank", "noopener");
      }
    } catch (err) {
      status.textContent = t.sendFailed;
    } finally { btn.disabled = false; }
  });

  /* ── guestbook ─────────────────────────────────────────────────── */
  function renderWishes(list) {
    const items = list || store.read(KEY.wish);
    const box = $("#wishList");
    box.textContent = "";
    $("#wishEmpty").classList.toggle("hidden", items.length > 0);
    items.slice().reverse().forEach((w, i) => {
      const el = document.createElement("article");
      el.className = "wish";
      el.style.animationDelay = Math.min(i, 8) * 60 + "ms";
      const p = document.createElement("p");
      p.textContent = "“" + w.message + "”";
      const c = document.createElement("cite");
      c.textContent = "— " + w.name;
      el.append(p, c);
      box.appendChild(el);
    });
  }

  $("#wishForm").addEventListener("submit", async e => {
    e.preventDefault();
    const t = T[lang], status = $("#wishStatus");
    const name = $("#wName").value.trim(), message = $("#wMsg").value.trim();
    if (!name || !message) { status.textContent = t.wishNeed; return; }

    const entry = { type: "wish", name, message, lang, at: new Date().toISOString() };
    const btn = $("#wishSubmit");
    btn.disabled = true; status.textContent = t.sending;
    try {
      await post(entry);
      renderWishes(store.push(KEY.wish, entry));
      status.textContent = t.wishOk;
      e.target.reset();
    } catch (err) {
      status.textContent = t.sendFailed;
    } finally { btn.disabled = false; }
  });

  async function loadWishes() {
    if (!CONFIG.endpoint) return;
    try {
      const res = await fetch(CONFIG.endpoint + "?type=wish");
      const remote = await res.json();
      if (Array.isArray(remote) && remote.length) renderWishes(remote);
    } catch (e) {}
  }

  /* ── add to calendar ───────────────────────────────────────────── */
  const stamp = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");

  $("#calBtn").addEventListener("click", async () => {
    const title = CONFIG.groom[lang] + " " + T[lang].amp + " " + CONFIG.bride[lang];
    const ics = [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//wedding//invitation//EN",
      "BEGIN:VEVENT",
      "UID:" + stamp(START) + "@wedding",
      "DTSTAMP:" + stamp(new Date()),
      "DTSTART:" + stamp(START),
      "DTEND:" + stamp(END),
      "SUMMARY:" + title,
      "LOCATION:" + CONFIG.venue.name[lang] + ", " + CONFIG.venue.address[lang],
      "END:VEVENT", "END:VCALENDAR"
    ].join("\r\n");
    const filename = "wedding.ics";
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const dl = await window.claude.use("downloads");
        if (dl) { await dl.save({ filename, data: ics }); return; }
      }
    } catch (e) {}
    const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  /* ── go ────────────────────────────────────────────────────────── */
  document.body.classList.add("locked");
  applyVariant(variant);
  applyLang(lang);
  loadWishes();

  if (reduce) {
    opened = true;
    $$(".gate").forEach(g => g.classList.add("done"));
    document.body.classList.remove("locked");
    document.body.classList.add("open");
    $$(".reveal, .wipe").forEach(el => el.classList.add("in"));
    $$(".w").forEach(w => w.classList.add("in"));
  }
})();
</script>
</body>
</html>
